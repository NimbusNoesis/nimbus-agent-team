{{ define "main" }}

<div class="page-header">
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p>{{ . }}</p>{{ end }}
  </div>
</div>

<div class="page-content">
  <div class="container">
    {{ .Content }}

    {{ if .Pages }}
    <div class="card-grid mt-2">
      {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="card" style="text-decoration: none; color: inherit;">
        <h3>{{ .Title }}</h3>
        {{ with .Params.description }}<p>{{ . }}</p>{{ end }}
        <span class="card-link">Read more &rarr;</span>
      </a>
      {{ end }}
    </div>
    {{ end }}
  </div>
</div>

{{ end }}
